# JVM settings for the Gradle daemon
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# KSP still registers its generated sources through the kotlin.sourceSets DSL,
# which AGP 9's built-in Kotlin support rejects by default.
android.disallowKotlinSourceSets=false
